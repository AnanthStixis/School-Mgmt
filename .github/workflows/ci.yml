name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms_ci_password
          POSTGRES_DB: sms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sms:sms_ci_password@localhost:5432/sms?schema=public
      # Throwaway values for the CI database only.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SEED_PASSWORD: ci-only-seed-password

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate and seed test database
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Unit tests
        run: pnpm --filter @sms/api test

      - name: End-to-end tests
        run: pnpm --filter @sms/api test:e2e
